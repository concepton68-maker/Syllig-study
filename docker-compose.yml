# Syllig Study — 2 conteneurs : l'application et sa base PostgreSQL (séparée de toute autre base du serveur)
name: syllig-study
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syllig
      POSTGRES_USER: syllig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllig -d syllig"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: syllig-study:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://syllig:${POSTGRES_PASSWORD}@db:5432/syllig
    ports:
      - "127.0.0.1:${APP_PORT:-8820}:3000"   # accessible uniquement depuis le serveur (Caddy)
volumes:
  db-data:
